<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Survey sign in · DEDC</title><link rel="stylesheet" href="/static/css/admin/workspace.css"></head><body class="survey-public"><main class="survey-signin"><a class="brand" href="/"><img class="brand-logo" src="/static/img/logo.png" alt="Ministry of Science and Technology logo" width="40" height="40"> DEDC <span class="badge">Survey access</span></a><section class="panel panel-body"><h1>Sign in to your surveys</h1><p class="editor-meta">Use the account provided by your administrator.</p>{% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}<form action="/survey/login" method="post" class="field-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Username<input name="username" autocomplete="username" required maxlength="100" value="{{ username | default('') }}"></label><label>Password<input type="password" name="password" autocomplete="current-password" required maxlength="1024"></label><button class="button primary" type="submit">Sign in</button></form></section></body></html>
