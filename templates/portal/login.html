<!doctype html>
<html lang="my">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>စီမံခန့်ခွဲသူ အကောင့်ဝင်ရန် · DEDC</title>
    <link rel="icon" href="/static/img/logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+Myanmar:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/admin/workspace.css" />
    <link
      rel="stylesheet"
      href="/static/css/admin/login.css?v=20261114-login2"
    />
    <script defer src="/static/js/portal.js?v=20261114-login2"></script>
  </head>
  <body class="survey-public login-page">
    <a class="skip" href="#main-content">အကြောင်းအရာသို့ ကျော်သွားရန်</a>
    <div class="auth-shell">
      <aside class="auth-visual" aria-hidden="true">
        <span class="auth-visual__grid"></span>
        <img
          class="auth-visual__mark"
          src="/static/img/logo.png"
          alt=""
          width="260"
          height="260"
        />
      </aside>

      <main class="auth-panel" id="main-content" tabindex="-1">
        <div class="auth-card">
          <div class="auth-brand">
            <img
              src="/static/img/logo.png"
              width="34"
              height="34"
              alt=""
            />
            <span class="auth-brand__name">DEDC</span>
          </div>

          <h1 class="auth-title">ပြန်လည်ကြိုဆိုပါတယ်။</h1>
          <p class="auth-subtitle">
            သင့် DEDC စီမံခန့်ခွဲမှု စနစ်ထဲသို့ ဝင်ရောက်ပါ။
          </p>

          {% if error %}
          <p class="auth-alert" role="alert">{{ error }}</p>
          {% endif %}

          <form
            action="{{ url_for('portal_login') }}"
            method="post"
            class="auth-form"
          >
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />

            <div class="auth-field">
              <label class="auth-label" for="portal-username"
                >အသုံးပြုသူအမည်</label
              >
              <div class="auth-control">
                <svg
                  class="auth-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M20 21a8 8 0 0 0-16 0" />
                  <circle cx="12" cy="8" r="4" />
                </svg>
                <input
                  class="auth-input"
                  id="portal-username"
                  name="username"
                  required
                  maxlength="100"
                  autocomplete="username"
                  autofocus
                  value="{{ username | default('') }}"
                  placeholder="အသုံးပြုသူအမည် ရိုက်ထည့်ပါ"
                />
              </div>
            </div>

            <div class="auth-field">
              <label class="auth-label" for="portal-password">စကားဝှက်</label>
              <div class="auth-control">
                <svg
                  class="auth-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <rect x="4.5" y="10" width="15" height="10.5" rx="2.5" />
                  <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                </svg>
                <input
                  class="auth-input auth-input--password"
                  id="portal-password"
                  name="password"
                  type="password"
                  required
                  maxlength="1024"
                  autocomplete="current-password"
                  placeholder="စကားဝှက် ရိုက်ထည့်ပါ"
                />
                <button
                  class="auth-eye"
                  type="button"
                  aria-controls="portal-password"
                  aria-pressed="false"
                  aria-label="စကားဝှက် ပြရန်"
                  data-password-toggle
                  hidden
                >
                  <svg
                    class="eye-open"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.9"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  <svg
                    class="eye-closed"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.9"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="m3 3 18 18" />
                    <path d="M10.6 10.6a3 3 0 0 0 4.2 4.2" />
                    <path
                      d="M9.4 5.3A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17.3 17.3 0 0 1-3.3 4.2"
                    />
                    <path
                      d="M6.1 6.1A17.4 17.4 0 0 0 2 12s3.5 7 10 7a10.8 10.8 0 0 0 4.4-.9"
                    />
                  </svg>
                </button>
              </div>
            </div>

            <button class="auth-submit" type="submit">
              <span>စနစ်ထဲသို့ ဝင်ရောက်ရန်</span>
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M5 12h14" />
                <path d="m13 6 6 6-6 6" />
              </svg>
            </button>
          </form>

          <p class="auth-switch">
            စစ်တမ်းဖြေဆိုသူလား။
            <a href="/survey/login"
              >စစ်တမ်းများသို့ ဝင်ရောက်ရန် <span aria-hidden="true">↗</span></a
            >
          </p>
        </div>

        <p class="auth-copyright">
          © 2026 DEDC · သိပ္ပံနှင့်နည်းပညာဝန်ကြီးဌာန
        </p>
      </main>
    </div>
  </body>
</html>
