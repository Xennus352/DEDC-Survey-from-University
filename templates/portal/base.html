<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b3452">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Admin portal{% endblock %} | DEDC</title>
  <link rel="icon" href="/static/img/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/base/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/base/reset.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/pages/portal.css') }}">
</head>
<body class="portal {% block body_class %}{% endblock %}" {% block body_attributes %}{% endblock %}>
  <a class="skip-link" href="#main-content">Skip to content</a>
  {% macro seal(size=44) %}<img class="portal-seal" src="/static/img/logo.png" alt="Ministry of Science and Technology seal" width="{{ size }}" height="{{ size }}">{% endmacro %}
  {% macro icon(name) %}
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    {% if name == 'arrow' %}<path d="M5 12h14m-5-5 5 5-5 5"/>
    {% elif name == 'external' %}<path d="M14 4h6v6m0-6L10 14m0-9H5a1 1 0 0 0-1 1v13a1 1 0 0 0 1 1h13a1 1 0 0 0 1-1v-5"/>
    {% elif name == 'grid' %}<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
    {% elif name == 'shield' %}<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="m8 12 3 3 5-6"/>
    {% elif name == 'user' %}<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>
    {% elif name == 'logout' %}<path d="M9 4H5v16h4m5-12 4 4-4 4m-5-4h12"/>
    {% elif name == 'lock' %}<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/>
    {% endif %}
  </svg>
  {% endmacro %}
  {% block layout %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
